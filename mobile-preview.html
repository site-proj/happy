<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111a14">
<title>Prévia mobile — Happy Hour Garden</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:#101710;color:#f3efe5;font:500 14px/1.5 'DM Sans',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px}
  header{text-align:center;margin:0 0 14px}
  header p{margin:0;color:#d5bb8e;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
  header h1{margin:5px 0 0;font-size:17px;font-weight:600;letter-spacing:.01em}
  .device{width:390px;height:min(780px,calc(100svh - 115px));min-height:580px;max-width:calc(100vw - 44px);border:7px solid #252b25;border-radius:30px;background:#111a14;overflow:hidden;box-shadow:0 26px 80px #0009,0 0 0 1px #ffffff26;position:relative}
  .device:before{content:"";position:absolute;z-index:2;top:5px;left:50%;width:78px;height:15px;transform:translateX(-50%);border-radius:20px;background:#252b25;pointer-events:none}
  iframe{width:100%;height:100%;display:block;border:0;background:#111a14}
  footer{margin-top:13px;color:#c4c5bb;font-size:11px;text-align:center}
  @media(max-height:720px){body{justify-content:flex-start;padding-top:14px}.device{height:min(74svh,580px);min-height:0}}
</style>
</head>
<body>
<header><p>Prévia mobile</p><h1>Happy Hour · Garden Café</h1></header>
<main class="device" aria-label="Prévia do site em formato de celular">
  <iframe src="./?mobile-preview=1" title="Site Happy Hour Garden na versão mobile" loading="eager"></iframe>
</main>
<footer>Role dentro da tela do celular para navegar pelo site.</footer>
</body>
</html>
